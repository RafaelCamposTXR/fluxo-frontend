<div class="tasks-page">
  <header class="page-header">
    <h1>Gerenciamento de Tarefas</h1>
    <button class="add-task-btn">Nova Tarefa</button>
  </header>

  <app-task-board>
    <div class="tasks-container">
      <h1>Lista de Tarefas</h1>

      <div class="task-list">
        <div class="task" *ngFor="let task of tasks">
          <div class="task-details">
            <h2>{{ task.title }}</h2>
            <p>{{ task.description }}</p>
            <p><strong>Data de Vencimento:</strong> {{ task.dueDate }}</p>
            <p><strong>Status:</strong> {{ task.status }}</p>
          </div>

          <div class="task-actions">
            <!-- Botão para alternar o status da tarefa -->
            <button (click)="toggleTaskStatus(task.id)">
              {{ task.status === 'concluída' ? 'Marcar como Pendente' : 'Marcar como Concluída' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </app-task-board>
</div>
