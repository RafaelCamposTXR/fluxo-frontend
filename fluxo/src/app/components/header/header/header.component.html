<header class="app-header">
  <div class="logo">
    <h1>Fluxo</h1>
  </div>
  <div class="actions">
    <button class="action-btn" (click)="onNewTask()" title="Nova Tarefa">
      <i class="fas fa-plus"></i>
    </button>
    <button class="action-btn" (click)="onProfile()" title="Perfil">
      <i class="fas fa-user"></i>
    </button>
    <button class="action-btn" (click)="onLogout()" title="Sair">
      <i class="fas fa-sign-out-alt"></i>
    </button>
  </div>
</header>
